apply plugin: 'com.android.application'

android {
    namespace = "pk.agrishop.farmer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pk.agrishop.farmer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /**
     * One phone, three environments.
     *
     * Dev, staging and production are separate installs rather than one app with a
     * switcher, because they talk to different backends and must be testable side by
     * side: the `.dev` and `.staging` suffixes give each its own application id, its
     * own data directory and its own icon label, so installing one never replaces
     * another. Production keeps the unsuffixed id that the store release uses.
     *
     * The web bundle inside each APK is built for its environment by
     * `scripts/build-apk.mjs`, which sets VITE_APP_ENV and the matching live-update
     * channel before `vite build`; the flavor only carries the identity.
     */
    flavorDimensions = ["environment"]

    productFlavors {
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            resValue "string", "app_name", "Farmer Dev"
            resValue "string", "title_activity_main", "Farmer Dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            resValue "string", "app_name", "Farmer Staging"
            resValue "string", "title_activity_main", "Farmer Staging"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Farmer"
            resValue "string", "title_activity_main", "Farmer"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase's client file declares one package — `pk.agrishop.farmer`, the production
// id. The `.dev` and `.staging` installs are different application ids, and the
// Google Services plugin fails the build rather than leaving push unconfigured
// ("No matching client found for package name 'pk.agrishop.farmer.dev'"). Push is a
// production feature, and inventing a client entry for the other two would mean a
// Firebase registration that cannot work, so their services tasks are switched off
// and those builds simply register for nothing.
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        tasks.whenTaskAdded { task ->
            if (task.name.contains('GoogleServices') && !task.name.contains('Production')) {
                task.enabled = false
            }
        }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
